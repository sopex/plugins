{% if OPNsense.netbird.settings.general.enable|default('0') == '1' and OPNsense.netbird.settings.dns.unboundForward|default('0') == '1' %}
{%   set domain = OPNsense.netbird.settings.dns.unboundDomain|default('netbird.cloud') %}
{%   if domain == '' %}
{%     set domain = 'netbird.cloud' %}
{%   endif %}
{%   set resolver = OPNsense.netbird.settings.dns.customAddress|default('') %}
{%   if resolver == '' %}
{%     set resolver = '127.0.0.1:5053' %}
{%   endif %}
{%   if resolver.startswith('[') and ']:' in resolver %}
{%     set host = resolver.split(']:')[0][1:] %}
{%     set port = resolver.split(']:')[1] %}
{%   elif ':' in resolver %}
{%     set host = resolver.split(':')[0] %}
{%     set port = resolver.split(':')[1] %}
{%   else %}
{%     set host = resolver %}
{%     set port = '53' %}
{%   endif %}
server:
{%   if host.startswith('127.') or host == '::1' %}
  do-not-query-localhost: no
{%   endif %}
  domain-insecure: "{{ domain }}"
  private-domain: "{{ domain }}"

forward-zone:
  name: "{{ domain }}"
  forward-addr: {{ host }}@{{ port }}
{% endif %}

{% from 'OPNsense/Macros/interface.macro' import physical_interface %}
[global]
{% if helpers.exists('OPNsense.MdnsBridge.general.interfaces') and OPNsense.MdnsBridge.general.interfaces != '' %}
{% set physnames = [] %}
{% for ifname in OPNsense.MdnsBridge.general.interfaces.split(',') %}
{% do physnames.append(physical_interface(ifname)) %}
{% endfor %}
  interfaces = {{ physnames | join(', ') }}
{% endif %}
{% if helpers.exists('OPNsense.MdnsBridge.general.disable_ipv4') and OPNsense.MdnsBridge.general.disable_ipv4 == '1' %}
  disable-ipv4 = yes
{% endif %}
{% if helpers.exists('OPNsense.MdnsBridge.general.disable_ipv6') and OPNsense.MdnsBridge.general.disable_ipv6 == '1' %}
  disable-ipv6 = yes
{% endif %}
{% if helpers.exists('OPNsense.MdnsBridge.general.filters') and OPNsense.MdnsBridge.general.filters != '' %}
{% if OPNsense.MdnsBridge.general.filtermode == 'allow' %}
  allow-inbound-filters = {{ OPNsense.MdnsBridge.general.filters.split(',') | join(', ') }}
{% elif OPNsense.MdnsBridge.general.filtermode == 'deny' %}
  deny-inbound-filters = {{ OPNsense.MdnsBridge.general.filters.split(',') | join(', ') }}
{% endif %}
{% endif %}

[start]
command:/usr/local/etc/rc.d/mdns_bridge start
parameters:
type:script
message:starting mdns-bridge

[stop]
command:/usr/local/etc/rc.d/mdns_bridge stop
parameters:
type:script
message:stopping mdns-bridge

[restart]
command:/usr/local/etc/rc.d/mdns_bridge restart
parameters:
type:script
message:restarting mdns-bridge

[status]
command:/usr/local/etc/rc.d/mdns_bridge status
errors:no
parameters:
type:script_output
message:mdns-bridge status
